server {
    listen 80;
    root /usr/share/nginx/html;

    # Sayfalar tarayıcıda React Router ile çiziliyor (/orders/123 gibi). Sunucuda böyle bir dosya yok;
    # bulunamayan her adres için index.html dönülür, React hangi sayfayı göstereceğine kendisi karar verir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite dosya adlarına içerik özeti ekliyor (index-3fa9c1.js). İçerik değişince ad da değişir,
    # bu yüzden bu dosyalar süresiz önbelleğe alınabilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html önbelleğe alınmaz: yeni sürüm yayınlanınca kullanıcı hemen yeni dosyalara geçsin.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
