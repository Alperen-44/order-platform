name: order-platform

services:
  # ---------- Veritabanları: her servisin kendi veritabanı var ----------
  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5433:5432"
    volumes:
      - ./services/order-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5434:5432"
    volumes:
      - ./services/inventory-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5435:5432"
    volumes:
      - ./services/payment-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    ports:
      - "5436:5432"
    volumes:
      - ./services/notification-service/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Mesajlaşma: Kafka (KRaft modu, Zookeeper yok) ----------
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topic'leri bilinçli olarak kafka-init oluşturuyor
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Topic'leri bir kez oluşturup kapanan yardımcı container.
  # 3 partition: aynı siparişin olayları aynı partition'a düşer (anahtar = orderId),
  # farklı siparişler paralel işlenebilir.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in order.events inventory.events payment.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        # Faz 3: her consumer group'un kendi Dead Letter Queue'su
        for topic in order-service.dlq inventory-service.dlq payment-service.dlq notification-service.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
        echo "Kafka topics ready"
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  # ---------- Uygulama servisleri ----------
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderDb: "Host=order-db;Port=5432;Database=orders;Username=order_user;Password=order_pass"
      Kafka__BootstrapServers: "kafka:19092"
      Saga__PaymentTimeoutSeconds: "15"   # ödeme 15 sn içinde sonuçlanmazsa sipariş iptal
    depends_on:
      order-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InventoryDb: "Host=inventory-db;Port=5432;Database=inventory;Username=inventory_user;Password=inventory_pass"
      Kafka__BootstrapServers: "kafka:19092"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PaymentDb: "Host=payment-db;Port=5432;Database=payments;Username=payment_user;Password=payment_pass"
      Kafka__BootstrapServers: "kafka:19092"
      PaymentProvider__FailureRate: "0.0"     # örn. 0.2 yaparsan ödemelerin %20'si reddedilir
      PaymentProvider__DelayMs: "300"
      PaymentProvider__SlowDelayMs: "25000"   # "yavaş" test müşterisi: saga zaman aşımından uzun
    depends_on:
      payment-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationDb: "Host=notification-db;Port=5432;Database=notifications;Username=notification_user;Password=notification_pass"
      Kafka__BootstrapServers: "kafka:19092"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

volumes:
  order-db-data:
  inventory-db-data:
  payment-db-data:
  notification-db-data:
